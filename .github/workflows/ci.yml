name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Record runtime and prepare logs
        run: |
          New-Item -ItemType Directory -Force artifacts/ci/logs, artifacts/ci/test-results, artifacts/ci-diagnostics | Out-Null
          dotnet --info 2>&1 | Tee-Object artifacts/ci/logs/dotnet-info.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore locked dependencies
        run: |
          dotnet restore Lokad.Qpdf.slnx --locked-mode 2>&1 | Tee-Object artifacts/ci/logs/restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Release
        run: |
          dotnet build Lokad.Qpdf.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ci/logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test development tool contracts
        run: |
          python -m pip install --disable-pip-version-check -r tools/compatibility-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test-compatibility-update.py 2>&1 | Tee-Object artifacts/ci/logs/compatibility-update.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test-warm-readiness.py 2>&1 | Tee-Object artifacts/ci/logs/warm-readiness.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test-warm-workers.py 2>&1 | Tee-Object artifacts/ci/logs/warm-workers.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test-object-stream-layout.py 2>&1 | Tee-Object artifacts/ci/logs/object-stream-layout.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File tools/test-reference-probe.ps1 `
            -ProbeDll tools/QpdfProbe/bin/Release/net11.0/QpdfProbe.dll `
            -OracleFixture tests/Lokad.Qpdf.OracleFixture/bin/Release/net11.0/Lokad.Qpdf.OracleFixture${{ matrix.os == 'windows-latest' && '.exe' || '' }} `
            -WorkRoot artifacts/ci/tool-controls `
            2>&1 | Tee-Object artifacts/ci/logs/tool-controls.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Release contracts
        timeout-minutes: 35
        run: |
          dotnet test Lokad.Qpdf.slnx -c Release --no-build --no-restore `
            --logger 'trx;LogFilePrefix=tests' `
            --results-directory artifacts/ci/test-results `
            --diag artifacts/ci-diagnostics/vstest.log `
            --blame-crash --blame-crash-dump-type mini `
            --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini `
            2>&1 | Tee-Object artifacts/ci/logs/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack Release
        run: |
          $package = ./tools/pack-release.ps1 -LogPath artifacts/ci/logs/pack.log
          "LOKAD_QPDF_CANDIDATE=$package" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Inspect package boundary
        run: |
          ./tools/verify-package.ps1 -PackagePath $env:LOKAD_QPDF_CANDIDATE `
            2>&1 | Tee-Object artifacts/ci/logs/package.log
      - name: Verify fresh artifact consumer
        run: |
          ./tools/verify-package-consumer.ps1 -PackagePath $env:LOKAD_QPDF_CANDIDATE `
            2>&1 | Tee-Object artifacts/ci/logs/consumer.log
      - name: Test consumer verification rejections
        run: |
          ./tools/test-package-consumer.ps1 -PackagePath $env:LOKAD_QPDF_CANDIDATE `
            2>&1 | Tee-Object artifacts/ci/logs/consumer-rejections.log
      - name: Capture failure process diagnostics
        if: failure()
        run: |
          New-Item -ItemType Directory -Force artifacts/ci/logs | Out-Null
          Get-Process | Select-Object Id, ProcessName, CPU, WorkingSet64 |
            Format-Table -AutoSize | Out-File artifacts/ci/logs/processes.log
      - name: Preserve test and package verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/logs/
            artifacts/ci/tool-controls/
            artifacts/ci/test-results/**/*.trx
            artifacts/consumer-tests/**/*.log
          retention-days: 14
          if-no-files-found: error
      - name: Preserve failed test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: verification-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-diagnostics/
            artifacts/ci/test-results/
            !artifacts/ci/test-results/**/*.trx
          retention-days: 14
          if-no-files-found: ignore

  reference:
    name: Reference (qpdf 12.4.2)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Record runtime and prepare logs
        run: |
          New-Item -ItemType Directory -Force artifacts/ci/logs | Out-Null
          dotnet --info 2>&1 | Tee-Object artifacts/ci/logs/dotnet-info.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire pinned qpdf 12.4.2 oracle
        run: |
          $oracle = ./tools/install-reference-qpdf.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'lokad-qpdf-oracle')
          "QPDF_EXE=$oracle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $oracle | Out-File artifacts/ci/logs/oracle.log
      - name: Restore locked reference dependencies
        run: |
          dotnet restore tools/QpdfProbe/QpdfProbe.csproj --locked-mode 2>&1 | Tee-Object artifacts/ci/logs/restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Release reference probe
        run: |
          dotnet build tools/QpdfProbe/QpdfProbe.csproj -c Release -f net11.0 --no-restore 2>&1 | Tee-Object artifacts/ci/logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run explicit reference checks with fresh scratch
        timeout-minutes: 35
        run: |
          ./tools/run-reference-checks.ps1 -QpdfExe $env:QPDF_EXE `
            -ProbeDll tools/QpdfProbe/bin/Release/net11.0/QpdfProbe.dll `
            -WorkRoot artifacts/reference-ci `
            2>&1 | Tee-Object artifacts/ci/logs/reference.log
      - name: Capture failure process diagnostics
        if: failure()
        run: |
          New-Item -ItemType Directory -Force artifacts/ci/logs | Out-Null
          Get-Process | Select-Object Id, ProcessName, CPU, WorkingSet64 |
            Format-Table -AutoSize | Out-File artifacts/ci/logs/processes.log
      - name: Preserve reference reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reference-results-${{ github.run_attempt }}
          path: |
            artifacts/ci/
            artifacts/reference-ci/**/results.json
            artifacts/reference-ci/**/*.reference.json
            artifacts/reference-ci/**/*.state.json
            artifacts/reference-ci/**/*.txt
            artifacts/reference-ci/**/*.log
            artifacts/reference-ci/**/*-stdout.bin
            artifacts/reference-ci/**/*-stderr.bin
          retention-days: 14
          if-no-files-found: error
